# Builds and publishes the application whenever main changes.
#
# Deliberately quiet until it is configured: with no secrets set it stops with
# a short explanation rather than failing, so the repository is not covered in
# red crosses before Firebase exists.
#
# What it deploys: the website, the Firestore security rules and the database
# indexes.
#
# NOT the Cloud Functions, and NOT the Storage rules. Both need the Blaze
# plan — Firebase will not even create a Storage bucket on the free plan — so
# deploying them here would fail on every push and make a working pipeline
# look broken. They have their own workflow, started by hand, for once Blaze
# is on.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] || [ -z "${{ secrets.FIREBASE_WEB_CONFIG }}" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "### Not deployed yet" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment needs two repository secrets: \`FIREBASE_WEB_CONFIG\` and \`FIREBASE_SERVICE_ACCOUNT\`." >> "$GITHUB_STEP_SUMMARY"
            echo "See \`docs/DEPLOYING.md\` — it is two copy-and-pastes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.ready == 'yes'
        run: npm ci

      - name: Write the Firebase configuration
        if: steps.check.outputs.ready == 'yes'
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: node scripts/writeEnvFromConfig.mjs

      - name: Build
        if: steps.check.outputs.ready == 'yes'
        run: |
          set -a
          . ./.env.local
          set +a
          npm run build

      # The service account arrives as text somebody pasted out of a downloaded
      # file, which is the one part of this whole setup a person does by hand.
      # So it is parsed rather than trusted: a byte-order mark from TextEdit, a
      # stray blank line, or half a file caught by a short Cmd+A all produce a
      # key that firebase-tools rejects with "have you run firebase login?" —
      # an error that sends people looking in entirely the wrong place.
      #
      # Parsing and re-writing the JSON strips all three, and says plainly
      # which one happened if it cannot.
      - name: Authenticate
        if: steps.check.outputs.ready == 'yes'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Explicit, rather than trusting the runner's default shell flags:
          # a credentials check that reports a problem and then exits 0 is
          # worse than no check, because the failure resurfaces two steps
          # later wearing a different error.
          set -eu
          node -e '
            const { writeFileSync } = require("node:fs");

            const raw = (process.env.SERVICE_ACCOUNT ?? "").replace(/^\uFEFF/, "").trim();
            const fail = (why, fix) => {
              console.error(`\nThe FIREBASE_SERVICE_ACCOUNT secret ${why}.\n${fix}\n`);
              process.exit(1);
            };

            if (!raw.startsWith("{") || !raw.endsWith("}")) {
              fail(
                "is not a whole JSON file",
                "It has to start with { and end with }. Open the downloaded .json again, " +
                  "press Cmd+A then Cmd+C, and update the secret.",
              );
            }

            let key;
            try {
              key = JSON.parse(raw);
            } catch (error) {
              fail(`could not be read as JSON (${error.message})`, "Copy the whole file again and update the secret.");
            }

            for (const field of ["type", "project_id", "client_email", "private_key"]) {
              if (!key[field]) fail(`has no "${field}"`, "That is not a service account key. Generate a new private key in Firebase console → Project settings → Service accounts.");
            }
            if (!key.private_key.includes("BEGIN PRIVATE KEY")) {
              fail("has a private_key that does not look like a key", "Copy the whole file again and update the secret.");
            }

            // Re-written from the parsed object, so whatever whitespace or
            // encoding came along for the ride does not reach the CLI.
            writeFileSync(`${process.env.RUNNER_TEMP}/key.json`, JSON.stringify(key));
            console.log(`Credentials look right — project ${key.project_id}, account ${key.client_email}.`);
          '
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=all-for-love-8ca52" >> "$GITHUB_ENV"

      - name: Deploy the site and the rules
        if: steps.check.outputs.ready == 'yes'
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --non-interactive \
            --project all-for-love-8ca52

      - name: Say where it went
        if: steps.check.outputs.ready == 'yes'
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://all-for-love-8ca52.web.app" >> "$GITHUB_STEP_SUMMARY"
