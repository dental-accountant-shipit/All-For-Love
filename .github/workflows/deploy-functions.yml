# Everything that needs the Blaze plan: the Cloud Functions — the rollup chain
# and budget approval — and the Storage rules, since Firebase will not create a
# Storage bucket at all on the free plan.
#
# Separate from the main deploy and started by hand, because until Blaze is on
# this would fail on every push and make a working pipeline look broken.
#
# To run it: the Actions tab in GitHub, "Deploy Cloud Functions and Storage"
# on the left, then the "Run workflow" button.

name: Deploy Cloud Functions and Storage

on:
  workflow_dispatch:

jobs:
  functions:
    name: Deploy functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci
          npm --prefix functions install

      - name: Build the functions
        run: npm --prefix functions run build

      - name: Authenticate
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          # --force sets up an artifact cleanup policy without prompting.
          #
          # Without it the deploy exits non-zero even when every function went
          # up, and — more to the point — every deploy leaves its container
          # images behind for ever. Firebase warns about it in passing: "this
          # may result in a small monthly bill as container images accumulate
          # over time". A bill that grows quietly is worse than one that is
          # merely large.
          npx --yes firebase-tools@latest deploy \
            --only functions,storage \
            --force \
            --non-interactive \
            --project all-for-love-8ca52
